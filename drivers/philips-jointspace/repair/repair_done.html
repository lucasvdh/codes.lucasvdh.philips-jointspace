<!DOCTYPE html>
<html>
<head>
  <style>
    html, body { height: 100%; margin: 0; }
    body { padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; color: #333; }
    h2 { margin-top: 0; color: #2A63CC; }
    p { line-height: 1.5; color: #555; }
    button { margin-top: 1rem; padding: 0.6rem 1.4rem; border-radius: 4px; border: 1px solid #2A63CC; background: #2A63CC; color: white; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
<h2 data-i18n="repair.done.title">Repair finished</h2>
<p data-i18n="repair.done.body">
  Your device has been re-linked to the TV. All your existing flows keep working.
</p>
<button id="close" data-i18n="repair.done.close">Done</button>

<script>
  // Pair-iframe injects Homey automatically - no /homey.js script tag,
  // no onHomeyReady wrapper. Same pattern as the other pair views.
  Homey.setTitle(Homey.__('repair.done.title') || 'Repair finished');
  document.getElementById('close').addEventListener('click', function () {
    Homey.done();
  });
</script>
</body>
</html>
