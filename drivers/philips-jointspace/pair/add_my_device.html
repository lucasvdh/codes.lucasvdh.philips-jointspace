<script type="application/javascript">
  Homey.setTitle(Homey.__('pair.add_device.title'))

  function fail(error) {
    var message = (error && error.message) || String(error)
    Homey.hideLoadingOverlay()
    Homey.emit('createDeviceFailed', message).catch(function () {})
    Homey.alert(message, 'error')
  }

  Homey.emit('getDevice', null)
    .then(function (device) {
      Homey.showLoadingOverlay()
      return Homey.createDevice(device)
    })
    .then(function () {
      Homey.done()
    })
    .catch(fail)
</script>
